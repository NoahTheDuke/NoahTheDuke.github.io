media: content/img
content:
  - name: all
    label: All
    type: group
    items:
      - name: posts
        label: Posts
        type: collection
        path: content/md/posts
        filename:
          template: "{year}-{month}-{day}-{primary}.md"
          field: true
        fields:
          - name: title
            type: string
          - name: date
            type: string
          - name: at-uri
            type: string
          - name: tags
            type: block
            list: true
            blocks:
              - name: text
          - name: body
            type: rich-text
      - name: pages
        label: Pages
        type: collection
        path: content/md/pages
        filename:
          template: "{primary}.md"
          field: true